spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

app:
  jwt:
    secret: ${JWT_SECRET}
    expirationMs: ${JWT_EXPIRATION_MS:900000}
  bootstrap:
    admin:
      email: ${DEMO_ADMIN_EMAIL:}
      password: ${DEMO_ADMIN_PASSWORD:}
    user:
      email: ${DEMO_USER_EMAIL:}
      password: ${DEMO_USER_PASSWORD:}