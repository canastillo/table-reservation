spring:
  datasource:
    driver-class-name: org.postgresql.Driver
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  web:
    locale: en

logging:
  level:
    com.restaurant.reservation.controller.AdminController: INFO

# SpringDoc
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method # order by http methods
    tagsSorter: alpha # order alphabetically