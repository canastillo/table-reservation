server:
  port : 8081
spring:
  datasource:
    # TODO: add templates
    url: jdbc:postgresql://localhost:5432/table-reservations
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update # TODO: return to validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  log:
    level:
      com.restaurant.reservation.controller.AdminController: INFO
  web:
    locale: en

# SpringDoc
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method # order by http methods
    tagsSorter: alpha # order alphabetically